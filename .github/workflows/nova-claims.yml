name: Nova claims
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: nova-claims
  cancel-in-progress: false
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - run: python nova_claims.py
        env:
          GCP_KEY: ${{ secrets.GCP_KEY }}
